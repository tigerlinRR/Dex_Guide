# Dex guide waypoints — re-synced from the robot map 2026-09-24. At runtime the console
# re-reads each stop's pose from the map by `id` (POI id), so these are only a fallback.
# Guide5 removed per request (boss: skip that stop). Tour is now Guide1-Guide4.
# audio: file per stop (AI TTS). Use the .wav under audio/wav/ — paplay on the Jetson may not decode mp3.
# run_stop: this stop's name in ~/dex_guide/stations.yaml on the Jetson. When set, the
#   finalized run_stop.py playback plays gesture + narration and `audio:` is not used.

# After the last stop the tour returns here and docks (robot-api goHome). Values are the
# robot's own POI "Charging pile - Dex Guide" (type 9), copied verbatim — yaw in DEGREES.
home:
  name: "Charging pile - Dex Guide"
  poi_id: "6ab1bff2d2f89a2e6afe7731"
  x: 25.341945846551855
  y: -15.366316540522734
  yaw_deg: 162.72

stations:
  - id: "6ab1c0af4f38299be615688e"
    order: 1
    name: "Guide1"
    subtitle: "Welcome · Reception"
    poi_name: "Guide1"
    chassis_pose: {x: 27.4405, y: -2.6158, ori: 4.1993}   # yaw=240.60 deg
